# 文件目的：提供南科大青橙风格的 Hermes Dashboard 亮色主题。
name: sustech-light
label: SUSTech Light
description: Bright cyan and warm orange for daytime use

palette:
  background: { hex: "#EAF8F7", alpha: 1 }
  midground: { hex: "#075B5F", alpha: 1 }
  foreground: { hex: "#F28C28", alpha: 0.16 }
  warmGlow: "rgba(242, 140, 40, 0.18)"
  noiseOpacity: 0.12

typography:
  fontSans: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  fontMono: 'ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace'
  fontDisplay: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  baseSize: "16px"
  lineHeight: "1.6"
  letterSpacing: "-0.004em"

layout: { radius: "0.75rem", density: comfortable }
layoutVariant: standard
terminalBackground: "#EAF8F7"
terminalForeground: "#075B5F"
seriesColors: { inputTokenAccent: "#008F95", outputTokenAccent: "#F28C28" }
swatchColors: ["#EAF8F7", "#008F95", "#F28C28"]

colorOverrides:
  card: "#FFFFFF"
  cardForeground: "#123E40"
  popover: "#FFFFFF"
  popoverForeground: "#123E40"
  primary: "#008F95"
  primaryForeground: "#FFFFFF"
  secondary: "#DDF3F1"
  secondaryForeground: "#075B5F"
  muted: "#E3F1F0"
  mutedForeground: "#527174"
  accent: "#F28C28"
  accentForeground: "#3D2208"
  destructive: "#D94C4C"
  destructiveForeground: "#FFFFFF"
  success: "#12866F"
  warning: "#F28C28"
  border: "rgba(0, 143, 149, 0.28)"
  input: "rgba(0, 143, 149, 0.38)"
  ring: "#F28C28"

componentStyles:
  card:
    background: "linear-gradient(145deg, rgba(255,255,255,0.98), rgba(240,250,249,0.96))"
    boxShadow: "0 10px 28px rgba(7,91,95,0.08), inset 0 0 0 1px rgba(0,143,149,0.08)"
  header:
    background: "linear-gradient(90deg, rgba(255,255,255,0.98), rgba(221,243,241,0.96))"
  sidebar:
    background: "linear-gradient(180deg, rgba(255,255,255,0.98), rgba(234,248,247,0.98))"

customCSS: |
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto 0;
    z-index: 1000;
    height: 3px;
    pointer-events: none;
    background: linear-gradient(90deg, #008F95 0 72%, #F28C28 72% 100%);
  }
  ::selection { color: #123E40; background: rgba(242, 140, 40, 0.28); }
  @media (max-width: 640px) {
    .text-sm.text-foreground.leading-relaxed,
    .text-sm.text-foreground.leading-relaxed .text-sm { font-size: 1rem !important; line-height: 1.7 !important; }
    .text-sm.text-foreground.leading-relaxed .text-xs { font-size: 0.875rem !important; }
  }
